# Create a draft release to preview changelog without submitting production releases
name: Draft Release
on:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
      - 'v*-alpha*' # i.e. v1.0.0-alpha, v1.0.0-alpha.1
      - 'v*-beta*' # i.e. v1.0.1-beta

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # To use this repository's private action, you must check out the repository
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The repo has tags but no prior GitHub release to diff from
      - name: Previous tag
        id: previous
        run: echo "tag=$(git describe --tags --abbrev=0 --match 'v*.*.*' "${{ github.sha }}^")" >> "$GITHUB_OUTPUT"

      - name: Jirafy Changelog
        id: changelog
        uses: ./
        with:
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          jiraHost: ${{ secrets.JIRA_HOST }}
          head-ref: ${{ github.ref_name }}
          base-ref: ${{ steps.previous.outputs.tag }}

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.changelog }}
          draft: true
          prerelease: false
