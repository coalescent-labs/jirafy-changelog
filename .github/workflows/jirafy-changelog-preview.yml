name: jirafy-changelog-preview
on: push

jobs:
  jirafy-changelog-preview:
    runs-on: ubuntu-latest
    steps:
      # To use this repository's private action, you must check out the repository
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The repo has tags but no prior GitHub release to diff from
      - name: Previous tag
        id: previous
        run: echo "tag=$(git describe --tags --abbrev=0 --match 'v*.*.*' --exclude '*-*')" >> "$GITHUB_OUTPUT"

      - name: Jirafy Changelog
        id: changelog
        uses: ./
        with:
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          jiraHost: ${{ secrets.JIRA_HOST }}
          base-ref: ${{ steps.previous.outputs.tag }}
